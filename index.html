<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gateway URL Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        #resultUrl { color: green; font-weight: bold; margin-top: 20px; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>अपना कस्टम API URL बनाएं</h2>
    
    <input type="text" id="projectName" placeholder="प्रोजेक्ट का नाम (Hey Nova)" required>
    <input type="text" id="geminiKey" placeholder="Gemini API Key (Optional)">
    <input type="text" id="openaiKey" placeholder="OpenAI API Key (Optional)">
    <input type="text" id="userEmail" placeholder="आपका ईमेल" required>
    
    <button onclick="generateURL()">URL जनरेट करें</button>

    <div id="resultUrl"></div>

    <script>
        async function generateURL() {
            // फॉर्म से डेटा लें
            const data = {
                projectName: document.getElementById('projectName').value,
                apiKeys: {
                    gemini: document.getElementById('geminiKey').value,
                    openai: document.getElementById('openaiKey').value
                },
                userInfo: {
                    email: document.getElementById('userEmail').value
                }
            };

            // अपने Render सर्वर पर डेटा भेजें (यहाँ अपना Render URL डालें)
            const serverUrl = "https://your-render-app-name.onrender.com/create-url";

            try {
                const response = await fetch(serverUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if(result.success) {
                    document.getElementById('resultUrl').innerText = "आपका नया URL: " + result.url;
                } else {
                    alert("कुछ गलती हुई: " + result.error);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("सर्वर से कनेक्ट नहीं हो पाया।");
            }
        }
    </script>
</body>
</html>
